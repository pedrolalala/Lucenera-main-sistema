name: Panorama Financeiro semanal

on:
  schedule:
    # Toda sexta-feira as 8h07 (horario de Brasilia, UTC-3 o ano todo -
    # Brasil nao usa horario de verao desde 2019). 11h07 UTC.
    - cron: "7 11 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: pip install psycopg2-binary

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Gerar relatorio (HTML + PDF) e enviar por e-mail
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          DATA_HOJE=$(date +%Y-%m-%d)
          PASTA="01-Documento/03 - Relatorios"
          mkdir -p "$PASTA"

          python scripts/panorama_financeiro/gerar_relatorio.py \
            --out-html "$PASTA/Panorama_Financeiro_Lucenera_${DATA_HOJE}.html" \
            --pdf "$PASTA/Panorama_Financeiro_Lucenera_${DATA_HOJE}.pdf" \
            --chrome "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --email-to pedro@lucenera.com.br

          cp "$PASTA/Panorama_Financeiro_Lucenera_${DATA_HOJE}.html" "$PASTA/Panorama_Financeiro_Lucenera_latest.html"
          cp "$PASTA/Panorama_Financeiro_Lucenera_${DATA_HOJE}.pdf" "$PASTA/Panorama_Financeiro_Lucenera_latest.pdf"

      - name: Commit e push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "01-Documento/03 - Relatorios"
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "chore: panorama financeiro semanal $(date +%Y-%m-%d)"
            git push
          fi
